name: merSETA NSDMS UI/UX & Accessibility CI Quality Gate

on:
  push:
    branches: [ "main", "develop", "release/*", "feature/*" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  ui_ux_compliance_gate:
    name: 5-Pillar UI/UX & Accessibility Verification
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Playwright Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install chromium

      - name: Build .NET Solution
        run: dotnet build Nsdms.slnx --configuration Release

      - name: Execute Domain Unit & Calculation Tests
        run: dotnet test Nsdms.slnx --configuration Release --no-build --verbosity normal

      - name: Start NSDMS Web Server (Background Test Circuit)
        shell: powershell
        run: |
          $process = Start-Process -FilePath "dotnet" -ArgumentList "run --project dotnet/Nsdms.Web --no-build --urls http://localhost:5121" -PassThru
          Start-Sleep -Seconds 12
          Write-Host "Kestrel Test Server started with PID: $($process.Id)"

      - name: Execute CI/CD Multi-Tier Quality Gate
        run: python scripts/ci_ux_quality_gate.py

      - name: Upload Compliance Audit Scorecard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nsdms-ui-compliance-scorecard
          path: docs/compliance/audit_results.json
