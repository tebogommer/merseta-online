name: NSDMS CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test (.NET 10)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore Nsdms.slnx

      - name: Build Solution (with NSDMS0001 Guard)
        run: dotnet build Nsdms.slnx --configuration Release --no-restore

      - name: Run Test Suite (with Parity & Discovery Tests)
        run: dotnet test Nsdms.slnx --configuration Release --no-build --verbosity normal
