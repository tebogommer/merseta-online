# NSDMS Option and Lookup Control Declarations v1.1
# Governed by ICT-STD-UI-001 / OPT Agent Standard
version: "1.1"
application: "MerSETA NSDMS Enterprise Platform"
governance_mode: "ADOPTED"
standard_version: "0.7 (draft)"

# Global Constraints & Defaults per E.1 / E.2
thresholds:
  native_select_max: 15
  searchable_combobox_min: 16
  lookup_dialog_min: 500
  search_debounce_ms: 300
  search_min_chars: 2
  search_result_cap: 50

