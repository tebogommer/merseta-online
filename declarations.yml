# --- Workflow State / Status Fields (OPT-001 - Read-Only Only) ---
status_fields:
  - entity: "Organisation"
    field: "StatusCode"
    control: "StatusBadge"
    workflow_actions: ["ApproveRegistration", "RejectRegistration", "SuspendOrganisation"]

  - entity: "AqpPartner"
    field: "StatusCode"
    control: "StatusBadge"
    workflow_actions: ["AccreditPartner", "DeAccreditPartner", "AuditPartner"]

  - entity: "AssessorModeratorApplication"
    field: "StatusCode"
    control: "StatusBadge"
    workflow_actions: ["RegisterAssessor", "DeRegisterAssessor", "RenewRegistration"]

  - entity: "AssessorScope"
    field: "RegistrationStatusCode"
    control: "StatusBadge"
    workflow_actions: ["ApproveScope", "RejectScope", "ExpireScope"]

  - entity: "AssessorCompetencyAssessment"
    field: "CompetencyStatusCode"
    control: "StatusBadge"
    workflow_actions: ["AssessCompetent", "AssessNotYetCompetent"]

  - entity: "DiscretionaryGrant"
    field: "StatusCode"
    control: "StatusBadge"
    workflow_actions: ["SubmitApplication", "EvaluateApplication", "ApproveApplication", "DeclineApplication"]

  - entity: "LevyFile"
    field: "StatusCode"
    control: "StatusBadge"
    workflow_actions: ["ProcessBatch", "ReconcileBatch", "ArchiveBatch"]

  - entity: "SarsSchemeYearConfig"
    field: "StatusCode"
    control: "StatusBadge"
    workflow_actions: ["ActivateSchemeYear", "CloseSchemeYear"]

  - entity: "TrainingProvider"
    field: "ProviderStatusCode"
    control: "StatusBadge"
    workflow_actions: ["AccreditProvider", "AuditProvider", "SuspendProvider", "WithdrawAccreditation"]

  - entity: "TrainingProviderQualification"
    field: "AccreditationStatusCode"
    control: "StatusBadge"
    workflow_actions: ["ApproveQualificationScope", "RejectQualificationScope"]

  - entity: "WorkplaceApproval"
    field: "ApprovalStatusCode"
    control: "StatusBadge"
    workflow_actions: ["RecommendApproval", "AuthorizeApproval", "RejectApproval"]

  - entity: "WspSubmission"
    field: "StatusCode"
    control: "StatusBadge"
    workflow_actions: ["SubmitWsp", "QuorumSignOff", "ApproveWsp", "RejectWsp", "LodgeDispute"]
